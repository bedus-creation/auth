[project]
name = "auth"
version = "0.1.0"
description = "Tenant-aware authentication service — validates identities and issues JWTs"
authors = [
    { name = "Bedram Tamang", email = "tmgbedu@gmail.com" }
]
readme = "readme.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "cleo>=2.1.0",
    "fastapi-startkit[database,fastapi,postgres]",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
fastapi-startkit = { path = "../../packages/fastapi-startkit-framework/fastapi_startkit", editable = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "dumpdie>=1.5.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
